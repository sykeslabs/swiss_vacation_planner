<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam – Ferien clever planen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"
        crossorigin="anonymous">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="map" role="application" aria-label="Karte der Schweiz"></div>

  <!-- Onboarding: 1 Jahr → 2 Arbeitsort → 3 Präferenzen (built in wizard.js). -->
  <section id="wizard" class="glass panel wizard" aria-label="Einrichtung" hidden></section>

  <!-- Top right, left to right: "+", ⚙, ?, Reset. "?" is always there, the others after onboarding. -->
  <nav id="top-controls" class="glass panel top-controls" aria-label="Steuerung">
    <button id="btn-add" type="button" class="icon-btn" aria-label="Ort hinzufügen" title="Ort hinzufügen"
            aria-controls="add-search" aria-expanded="false" hidden>+</button>
    <button id="btn-prefs" type="button" class="icon-btn" aria-label="Präferenzen" title="Präferenzen"
            aria-haspopup="dialog" hidden>⚙</button>
    <button id="btn-help" type="button" class="icon-btn" aria-label="Über Adam" title="Über Adam"
            aria-haspopup="dialog">?</button>
    <button id="btn-reset" type="button" class="icon-btn text-btn" aria-label="Alles zurücksetzen"
            title="Alles zurücksetzen" aria-haspopup="dialog" hidden>Reset</button>
  </nav>

  <!-- "+": search for another town. -->
  <section id="add-search" class="glass panel add-search" aria-label="Ort hinzufügen" hidden>
    <div class="search">
      <input id="location-search" type="search" role="combobox" aria-autocomplete="list"
             aria-expanded="false" aria-controls="location-results" aria-label="Ort oder PLZ suchen"
             placeholder="Ort oder PLZ suchen" autocomplete="off" spellcheck="false">
      <ul id="location-results" class="results" role="listbox" aria-label="Suchergebnisse" hidden></ul>
      <p id="search-status" class="search-status" role="status" aria-live="polite" hidden></p>
    </div>
    <button id="add-search-close" type="button" class="chip-remove" aria-label="Suche schliessen"
            title="Schliessen">×</button>
  </section>

  <!-- Planner panel (after onboarding): town chips and vacation type; movable. -->
  <section id="planner" class="glass panel settings-panel planner-panel" aria-labelledby="planner-title" hidden>
    <header class="panel-head" tabindex="0" title="Ziehen zum Verschieben"
            aria-label="Planer: Panel verschieben mit Ziehen oder Pfeiltasten">
      <h2 id="planner-title" class="town-title">Deine Orte</h2>
      <span class="head-actions">
        <button id="planner-toggle" type="button" class="chip-remove panel-toggle" aria-controls="planner-body"
                aria-expanded="true" aria-label="Planer einklappen" title="Einklappen">▾</button>
      </span>
    </header>
    <div id="planner-body">
      <ul id="town-chips" class="chips" aria-label="Gewählte Orte"></ul>
      <div class="field">
        <label for="vacation-type">Was für Ferien suchst du?</label>
        <select id="vacation-type" class="text-input"></select>
      </div>
    </div>
  </section>

  <!-- One movable panel per selected town (built in town-panels.js). -->
  <div id="town-panels" class="town-panels" aria-label="Kalender der gewählten Orte" hidden></div>

  <div class="glass panel layer-switch" role="group" aria-label="Kartenhintergrund">
    <button type="button" class="seg" data-layer="map" aria-pressed="false">Karte</button>
    <button type="button" class="seg" data-layer="satellite" aria-pressed="true">Satellit</button>
  </div>

  <div id="map-notice" class="glass panel notice" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"
          integrity="sha384-tXYNKOHx4T02jMP7YYCtBxPIv1B5gaA5mcVPBzqMp6d7VzWzxJgI2aWF/nJLrQdS"
          crossorigin="anonymous"></script>
  <!-- Contact and donation details for "Über Adam" (server environment, see README). -->
  <script type="application/json" id="about-config">{{ about | tojson }}</script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
