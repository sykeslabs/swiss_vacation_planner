<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferienplaner Schweiz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="map" role="application" aria-label="Karte der Schweiz"></div>

  <header class="glass panel search-panel">
    <h1>Ferienplaner Schweiz</h1>
    <div class="search">
      <label for="location-search" class="visually-hidden">Ort oder PLZ suchen</label>
      <input id="location-search" type="search" role="combobox" aria-autocomplete="list"
             aria-expanded="false" aria-controls="location-results"
             placeholder="Ort oder PLZ suchen" autocomplete="off" spellcheck="false">
      <ul id="location-results" class="results" role="listbox" aria-label="Suchergebnisse" hidden></ul>
      <p id="search-status" class="search-status" role="status" aria-live="polite" hidden></p>
    </div>
  </header>

  <aside id="planner" class="glass panel planner" aria-labelledby="planner-title" hidden>
    <section class="planner-section">
      <h2 id="planner-title">Deine Orte</h2>
      <ul id="location-chips" class="chips"></ul>
      <button id="add-location" type="button" class="btn-secondary">+ Ort hinzufügen</button>
      <p id="locations-hint" class="hint" role="status" hidden></p>
    </section>

    <details class="planner-section settings" open>
      <summary>Einstellungen</summary>
      <div class="field">
        <label for="planner-year">Jahr</label>
        <select id="planner-year"></select>
      </div>
      <div class="field">
        <span class="field-label" id="working-days-label">Arbeitstage</span>
        <div id="working-days" class="wd-toggles" role="group" aria-labelledby="working-days-label"></div>
        <p id="working-days-hint" class="hint" role="status" hidden></p>
      </div>
      <div class="field">
        <span class="field-label">Halbe Arbeitstage</span>
        <ul id="half-days" class="half-days"></ul>
        <div class="half-day-add">
          <label for="half-day-input" class="visually-hidden">Datum für halben Arbeitstag</label>
          <input id="half-day-input" type="date">
          <button id="half-day-add" type="button" class="btn-secondary">Hinzufügen</button>
        </div>
        <p id="half-day-hint" class="hint" role="status" hidden></p>
      </div>
    </details>

    <section class="planner-section" aria-labelledby="calendar-title">
      <h2 id="calendar-title">Kalender</h2>
      <p id="calendar-status" class="hint" role="status" aria-live="polite"></p>
      <div id="calendar"></div>
      <details class="legend-box" open>
        <summary>Legende</summary>
        <div id="calendar-legend"></div>
      </details>
      <p id="calendar-source" class="source-note"></p>
    </section>
  </aside>

  <div class="glass panel layer-switch" role="group" aria-label="Kartenhintergrund">
    <button type="button" class="seg" data-layer="map" aria-pressed="true">Karte</button>
    <button type="button" class="seg" data-layer="satellite" aria-pressed="false">Satellit</button>
  </div>

  <div id="map-notice" class="glass panel notice" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
          crossorigin="anonymous"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
